[general]
name = "gated-delta-attention"
license = "Apache-2.0"
version = 6
backends = ["cuda"]

[general.cuda]
minver = "12.8"

[general.hub]
repo-id = "flashrt/gated-delta-attention"

[torch]
include = ["csrc"]
src = [
  "torch-ext/torch_binding.cpp",
  "torch-ext/torch_binding.h",
]

[kernel.gated_delta_attention]
backend = "cuda"
depends = ["torch"]
include = ["csrc"]
cuda-minver = "12.8"
cuda-capabilities = ["8.0", "8.6", "8.9", "9.0", "10.0", "11.0a", "12.0", "12.0a", "12.1"]
src = [
  "csrc/gated_delta_attention.cu",
  "csrc/gated_delta_attention.cuh",
  "csrc/gated_delta_wy_bf16.cuh",
  "csrc/gated_delta_wy_recompute_wu_mma_fla.cu",
  "csrc/gated_delta_wy_bf16_mma_fla.cu",
  "csrc/gated_delta_wy_output_o_mma_fla.cu",
  "csrc/gated_delta_wy_kkt_mma.cu",
  "csrc/gated_delta_wy_kkt_mma.cuh",
  "csrc/kernels/batched_unit_ltri_inv64.cu",
  "csrc/kernels/batched_unit_ltri_inv64.cuh",
  "csrc/kernels/gdn_wy_norm_cumsum_pack_qk_v2.cu",
  "csrc/kernels/gdn_wy_norm_cumsum_pack_qk_v2.cuh",
]
cuda-flags = [
  "-U__CUDA_NO_BFLOAT16_CONVERSIONS__",
  "-U__CUDA_NO_BFLOAT16_OPERATORS__",
  "-U__CUDA_NO_BFLOAT162_OPERATORS__",
]

[kernel.gdn_recurrent_sequence_sm120]
backend = "cuda"
depends = ["torch"]
include = ["csrc"]
cuda-minver = "12.8"
cuda-capabilities = ["11.0a", "12.0"]
src = [
  "csrc/kernels/gdn_recurrent_seq_sm120.cu",
  "csrc/kernels/gdn_recurrent_seq_sm120.cuh",
  "csrc/kernels/gdn_chunk_from_conv_smem_stash.cu",
  "csrc/kernels/gdn_chunk_from_conv_smem_stash.cuh",
]
