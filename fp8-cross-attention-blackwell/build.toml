[general]
name = "fp8-cross-attention-blackwell"
license = "Apache-2.0"
version = 1
backends = ["cuda"]

[general.cuda]
minver = "13.0"
maxver = "13.0"

[general.hub]
repo-id = "flashrt/fp8-cross-attention-blackwell"

[torch]
include = ["csrc"]
src = ["torch-ext/torch_binding.cpp", "torch-ext/torch_binding.h"]

[kernel.fp8_cross_attention_blackwell]
backend = "cuda"
depends = ["torch", "cutlass_4_4"]
include = ["csrc/fmha77", "csrc"]
cuda-minver = "13.0"
cuda-capabilities = ["10.0a", "10.3a", "11.0a"]
cuda-flags = [
  "--expt-relaxed-constexpr",
  "-O3",
  "-DCUTLASS_ARCH_MMA_SM100_SUPPORTED=1",
]
src = [
  "csrc/cutlass_fp8_gqa_cross_attention_sm100.cu",
  "csrc/fmha77/collective/fmha_common.hpp",
  "csrc/fmha77/collective/fmha_fusion.hpp",
  "csrc/fmha77/collective/sm100_fmha_fwd_epilogue_tma_warpspecialized.hpp",
  "csrc/fmha77/collective/sm100_fmha_fwd_mainloop_tma_warpspecialized.hpp",
  "csrc/fmha77/collective/sm100_fmha_load_tma_warpspecialized.hpp",
  "csrc/fmha77/device/fmha.hpp",
  "csrc/fmha77/kernel/fmha_causal_tile_scheduler.hpp",
  "csrc/fmha77/kernel/fmha_options.hpp",
  "csrc/fmha77/kernel/fmha_tile_scheduler.hpp",
  "csrc/fmha77/kernel/sm100_fmha_fwd_kernel_tma_warpspecialized.hpp",
]
