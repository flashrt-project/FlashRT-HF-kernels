[general]
name = "transformer-fused-ops"
license = "Apache-2.0"
version = 1
backends = ["cuda"]

[general.cuda]
minver = "12.8"

[general.hub]
repo-id = "flashrt/transformer-fused-ops"

[torch]
include = ["csrc"]
src = [
  "torch-ext/torch_binding.cpp",
  "torch-ext/torch_binding.h",
]

[kernel.transformer_fused_ops]
backend = "cuda"
depends = ["torch"]
include = ["csrc"]
cuda-minver = "12.8"
src = [
  "csrc/kernels/rms_norm_gated_silu_qwen36.cu",
  "csrc/kernels/rms_norm_gated_silu_qwen36.cuh",
  "csrc/kernels/rms_norm_gated_silu_quant_fp4_bf16.cu",
  "csrc/kernels/rms_norm_gated_silu_quant_fp4_bf16.cuh",
  "csrc/kernels/silu_mul_qwen36.cu",
  "csrc/kernels/silu_mul_qwen36.cuh",
  "csrc/kernels/qwen36_misc.cu",
  "csrc/kernels/qwen36_misc.cuh",
  "csrc/kernels/nexn2_misc.cu",
  "csrc/kernels/nexn2_misc.cuh",
  "csrc/kernels/nexn2_router_topk.cu",
  "csrc/kernels/nexn2_router_topk.cuh",
  "csrc/kernels/moe_weighted_sum_sm120.cu",
  "csrc/kernels/moe_weighted_sum_sm120.cuh",
  "csrc/kernels/relu2_quantize_fp8.cu",
  "csrc/kernels/relu2_quantize_fp8.cuh",
]

[kernel.transformer_fused_ops_sm110_fp16]
backend = "cuda"
depends = ["torch"]
include = ["csrc"]
cuda-minver = "13"
cuda-capabilities = ["11.0a"]
cuda-flags = ["-O3"]
src = [
  "csrc/kernels/vec_fp16_backbone.cu",
  "csrc/kernels/vec_fp16_backbone.cuh",
  "csrc/kernels/vec_fp16_dispatch.cu",
  "csrc/kernels/vec_fp16_dispatch.cuh",
  "csrc/kernels/vec_bf16_producers.cu",
  "csrc/kernels/vec_bf16_producers.cuh",
]
