name: Build FlashRT Kernels On HF Jobs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-kernels-hf-jobs.yml"
      - "flashrt-gemm-epilogues/**"
      - "flashrt-fp8-ffn/**"
      - "flashrt-fp8-swiglu-ffn/**"
      - "flashrt-residual-norm-quant/**"
      - "flashrt-qkv-cache-rope/**"
      - "flashrt-vla-residual-gates/**"
      - "flashrt-adaptive-norms/**"
      - "flashrt-spatiotemporal-layout/**"
      - "flashrt-fused-quant/**"
      - "flashrt-nvfp4/**"
      - "flashrt-smallm-gemm/**"
      - "flashrt-vla-video/**"
      - "MiniMaxAI-msa-blackwell/**"
      - "vl-transformer-primitives/**"
      - "diffusion-step-ops/**"
      - "turboquant-kv/**"
      - "linear-attention-primitives/**"
      - "bf16-linear-gemv/**"
      - "transformer-fused-ops/**"
      - "grouped-moe-gemv/**"
      - "linear-attention-seq-state/**"
      - "world-model-conv/**"
      - "fp8-gemm/**"
      - "fp4-fused-ops/**"
      - "fp4-gemm/**"
      - "fa4-cute-runtime/**"
      - "fp8-kv-attention/**"
      - "causal-conv1d-state/**"
      - "gated-delta-attention/**"
      - "adaptive-layernorm-producers/**"
      - "sageattention2-blackwell/**"
      - "speculative-draft-primitives/**"
      - "int8-transformer-primitives/**"
      - "transformer-layout-primitives/**"
      - "flashrt-siglip-fwd-fusion/**"
      - "flashrt-qkv-epilogue-train/**"
      - "flashrt-rope-train/**"
      - "flashrt-vocab-ce-train/**"
      - "flashrt-adarms-train/**"
      - "flashrt-flex-attention-train/**"
      - "int4-blackwell/**"
      - "weight-only-ffn/**"
      - "fa2-seqused-runtime/**"
      - "small-matrix-cholesky/**"
      - "fp8-prefill-attention-blackwell/**"
      - "grouped-moe-gemm/**"
      - "smallm-ffn-megakernels-blackwell/**"
      - "blockwise-fp8-producers/**"
      - "padded-fp8-producers/**"
      - "audio-codebook-primitives/**"
      - "fp8-cross-attention-blackwell/**"
      - "fused-mlp-megakernels-blackwell/**"
      - "masked-mha-runtime/**"
  workflow_dispatch:
    inputs:
      package:
        description: "Kernel package to build and upload"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - flashrt-gemm-epilogues
          - flashrt-fp8-ffn
          - flashrt-fp8-swiglu-ffn
          - flashrt-residual-norm-quant
          - flashrt-qkv-cache-rope
          - flashrt-vla-residual-gates
          - flashrt-adaptive-norms
          - flashrt-spatiotemporal-layout
          - flashrt-fused-quant
          - flashrt-nvfp4
          - flashrt-smallm-gemm
          - flashrt-vla-video
          - MiniMaxAI-msa-blackwell
          - vl-transformer-primitives
          - diffusion-step-ops
          - turboquant-kv
          - linear-attention-primitives
          - bf16-linear-gemv
          - transformer-fused-ops
          - grouped-moe-gemv
          - linear-attention-seq-state
          - world-model-conv
          - fp8-gemm
          - fp4-fused-ops
          - fp4-gemm
          - fa4-cute-runtime
          - fp8-kv-attention
          - causal-conv1d-state
          - gated-delta-attention
          - adaptive-layernorm-producers
          - sageattention2-blackwell
          - speculative-draft-primitives
          - int8-transformer-primitives
          - transformer-layout-primitives
          - flashrt-siglip-fwd-fusion
          - flashrt-qkv-epilogue-train
          - flashrt-rope-train
          - flashrt-vocab-ce-train
          - flashrt-adarms-train
          - flashrt-flex-attention-train
          - int4-blackwell
          - weight-only-ffn
          - fa2-seqused-runtime
          - small-matrix-cholesky
          - fp8-prefill-attention-blackwell
          - grouped-moe-gemm
          - smallm-ffn-megakernels-blackwell
          - blockwise-fp8-producers
          - padded-fp8-producers
          - audio-codebook-primitives
          - fp8-cross-attention-blackwell
          - fused-mlp-megakernels-blackwell
          - masked-mha-runtime
      variants:
        description: "Optional comma-separated variants supported by the current builder"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Keep automatic push releases serialized, but do not let independent
  # single-package repair builds cancel one another while they are pending.
  group: flashrt-hf-kernel-build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.package || 'push' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - flashrt-gemm-epilogues
          - flashrt-fp8-ffn
          - flashrt-fp8-swiglu-ffn
          - flashrt-residual-norm-quant
          - flashrt-qkv-cache-rope
          - flashrt-vla-residual-gates
          - flashrt-adaptive-norms
          - flashrt-spatiotemporal-layout
          - flashrt-fused-quant
          - flashrt-nvfp4
          - flashrt-smallm-gemm
          - flashrt-vla-video
          - MiniMaxAI-msa-blackwell
          - vl-transformer-primitives
          - diffusion-step-ops
          - turboquant-kv
          - linear-attention-primitives
          - bf16-linear-gemv
          - transformer-fused-ops
          - grouped-moe-gemv
          - linear-attention-seq-state
          - world-model-conv
          - fp8-gemm
          - fp4-fused-ops
          - fp4-gemm
          - fa4-cute-runtime
          - fp8-kv-attention
          - causal-conv1d-state
          - gated-delta-attention
          - adaptive-layernorm-producers
          - sageattention2-blackwell
          - speculative-draft-primitives
          - int8-transformer-primitives
          - transformer-layout-primitives
          - flashrt-siglip-fwd-fusion
          - flashrt-qkv-epilogue-train
          - flashrt-rope-train
          - flashrt-vocab-ce-train
          - flashrt-adarms-train
          - flashrt-flex-attention-train
          - int4-blackwell
          - weight-only-ffn
          - small-matrix-cholesky
          - fp8-prefill-attention-blackwell
          - grouped-moe-gemm
          - smallm-ffn-megakernels-blackwell
          - blockwise-fp8-producers
          - padded-fp8-producers
          - audio-codebook-primitives
          - fp8-cross-attention-blackwell
          - fused-mlp-megakernels-blackwell
          - masked-mha-runtime

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
        if: github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == matrix.package

      - name: Detect package changes
        id: changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/changed-files.txt; then
            git diff --name-only HEAD~1 HEAD > /tmp/changed-files.txt
          fi
          if grep -qE "^${{ matrix.package }}/" /tmp/changed-files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Kernel Hub repo exists for ${{ matrix.package }}
        if: (github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == matrix.package
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade "huggingface_hub>=1.1.0"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).create_repo(
              repo_id="flashrt/${{ matrix.package }}",
              repo_type="kernel",
              exist_ok=True,
          )
          PY

      - name: Build and upload ${{ matrix.package }} via HF Jobs
        if: (github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == matrix.package
        uses: huggingface/kernel-builder-job@main
        with:
          token: ${{ secrets.HF_TOKEN }}
          # HF Jobs billing/credits are attached to the runner namespace.
          # Artifacts are still uploaded to flashrt/<package> via --repo-id below.
          namespace: liangsu9988
          flavor: cpu-xl
          timeout: "21600"
          script: |
            # The HF Jobs container is started with `set -x`, which would echo
            # secrets into streamed logs. Disable tracing before exporting.
            set +x
            export HF_TOKEN="${{ secrets.HF_TOKEN }}"
            export GIT_LFS_SKIP_SMUDGE=1
            export DEBUG=0

            git clone "${{ github.server_url }}/${{ github.repository }}" FlashRT-HF-kernels
            cd FlashRT-HF-kernels
            git checkout "${{ github.sha }}"
            cd "${{ matrix.package }}"

            variants="${{ github.event.inputs.variants }}"
            if [[ -z "$variants" ]]; then
              nix run github:huggingface/kernels#kernel-builder -- build-and-upload \
                --max-jobs 4 \
                --cores 8 \
                --repo-id "flashrt/${{ matrix.package }}"
            else
              IFS=',' read -ra requested_variants <<< "$variants"
              for variant in "${requested_variants[@]}"; do
                variant="${variant//[[:space:]]/}"
                [[ -n "$variant" ]] || continue
                nix run github:huggingface/kernels#kernel-builder -- build-and-upload \
                  --variant "$variant" \
                  --max-jobs 1 \
                  --cores 8 \
                  --repo-id "flashrt/${{ matrix.package }}"
              done
            fi

      - name: Mirror ${{ matrix.package }} for legacy kernels clients
        if: (github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == matrix.package
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade "huggingface_hub>=1.1.0"
          python scripts/mirror_kernel_legacy_model.py \
            --namespace flashrt \
            --package "${{ matrix.package }}" \
            --repo-root .
          python scripts/promote_kernel_main_alias.py \
            --namespace flashrt \
            --package "${{ matrix.package }}" \
            --repo-root .

  build-fa2:
    name: Build fa2-seqused-runtime (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each FA2 derivation instantiates the same large template set. Building
      # the complete matrix inside one HF Job previously exhausted the remote
      # job after roughly two hours. Serialize independently uploadable variants so a
      # failed toolchain target can be retried without discarding the others.
      max-parallel: 1
      matrix:
        variant:
          - torch211-cxx11-cu128-x86_64-linux
          - torch211-cxx11-cu130-x86_64-linux
          - torch212-cxx11-cu130-x86_64-linux
          - torch212-cxx11-cu132-x86_64-linux
          - torch213-cxx11-cu130-x86_64-linux
          - torch213-cxx11-cu132-x86_64-linux

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
        if: github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == 'fa2-seqused-runtime'

      - name: Detect FA2 changes
        id: changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/changed-files.txt; then
            git diff --name-only HEAD~1 HEAD > /tmp/changed-files.txt
          fi
          if grep -qE "^fa2-seqused-runtime/" /tmp/changed-files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure FA2 Kernel Hub repo exists
        if: (github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == 'fa2-seqused-runtime'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade "huggingface_hub>=1.1.0"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).create_repo(
              repo_id="flashrt/fa2-seqused-runtime",
              repo_type="kernel",
              exist_ok=True,
          )
          PY

      - name: Build and upload FA2 variant via HF Jobs
        if: (github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == 'fa2-seqused-runtime'
        uses: huggingface/kernel-builder-job@main
        with:
          token: ${{ secrets.HF_TOKEN }}
          namespace: liangsu9988
          flavor: cpu-performance
          timeout: "10800"
          script: |
            set +x
            export HF_TOKEN="${{ secrets.HF_TOKEN }}"
            export GIT_LFS_SKIP_SMUDGE=1
            export DEBUG=0

            git clone "${{ github.server_url }}/${{ github.repository }}" FlashRT-HF-kernels
            cd FlashRT-HF-kernels
            git checkout "${{ github.sha }}"
            cd fa2-seqused-runtime

            nix run github:huggingface/kernels#kernel-builder -- build-and-upload \
              --variant "${{ matrix.variant }}" \
              --max-jobs 1 \
              --cores 32 \
              --repo-id "flashrt/fa2-seqused-runtime"

  mirror-fa2:
    name: Mirror fa2-seqused-runtime for legacy kernels clients
    needs: build-fa2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect FA2 changes
        id: changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/changed-files.txt; then
            git diff --name-only HEAD~1 HEAD > /tmp/changed-files.txt
          fi
          if grep -qE "^fa2-seqused-runtime/" /tmp/changed-files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror and verify FA2 legacy artifacts
        if: (github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == 'fa2-seqused-runtime'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade "huggingface_hub>=1.1.0"
          python scripts/mirror_kernel_legacy_model.py \
            --namespace flashrt \
            --package fa2-seqused-runtime \
            --repo-root .
