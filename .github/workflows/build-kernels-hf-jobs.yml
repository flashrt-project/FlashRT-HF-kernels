name: Build FlashRT Kernels On HF Jobs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-kernels-hf-jobs.yml"
      - "flashrt-gemm-epilogues/**"
      - "flashrt-fp8-ffn/**"
      - "flashrt-fp8-swiglu-ffn/**"
      - "flashrt-residual-norm-quant/**"
      - "flashrt-qkv-cache-rope/**"
      - "flashrt-vla-residual-gates/**"
      - "flashrt-adaptive-norms/**"
      - "flashrt-spatiotemporal-layout/**"
      - "flashrt-fused-quant/**"
      - "flashrt-nvfp4/**"
      - "flashrt-smallm-gemm/**"
      - "flashrt-vla-video/**"
      - "MiniMaxAI-msa-blackwell/**"
      - "vl-transformer-primitives/**"
      - "diffusion-step-ops/**"
      - "turboquant-kv/**"
      - "linear-attention-primitives/**"
      - "bf16-linear-gemv/**"
      - "transformer-fused-ops/**"
      - "grouped-moe-gemv/**"
      - "linear-attention-seq-state/**"
      - "world-model-conv/**"
      - "fp8-gemm/**"
      - "fp4-fused-ops/**"
      - "fp4-gemm/**"
      - "fa4-cute-runtime/**"
      - "fp8-kv-attention/**"
      - "causal-conv1d-state/**"
      - "gated-delta-attention/**"
      - "adaptive-layernorm-producers/**"
      - "sageattention2-blackwell/**"
      - "sageattention3-blackwell/**"
      - "speculative-draft-primitives/**"
      - "int8-transformer-primitives/**"
      - "transformer-layout-primitives/**"
      - "flashrt-siglip-fwd-fusion/**"
      - "flashrt-qkv-epilogue-train/**"
      - "flashrt-rope-train/**"
      - "flashrt-vocab-ce-train/**"
      - "flashrt-adarms-train/**"
      - "flashrt-flex-attention-train/**"
      - "int4-blackwell/**"
      - "weight-only-ffn/**"
      - "fa2-seqused-runtime/**"
      - "small-matrix-cholesky/**"
      - "fp8-prefill-attention-blackwell/**"
      - "grouped-moe-gemm/**"
      - "smallm-ffn-megakernels-blackwell/**"
      - "blockwise-fp8-producers/**"
      - "padded-fp8-producers/**"
      - "audio-codebook-primitives/**"
      - "fp8-cross-attention-blackwell/**"
      - "fused-mlp-megakernels-blackwell/**"
      - "masked-mha-runtime/**"
  workflow_dispatch:
    inputs:
      package:
        description: "Kernel package to build and upload"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - flashrt-gemm-epilogues
          - flashrt-fp8-ffn
          - flashrt-fp8-swiglu-ffn
          - flashrt-residual-norm-quant
          - flashrt-qkv-cache-rope
          - flashrt-vla-residual-gates
          - flashrt-adaptive-norms
          - flashrt-spatiotemporal-layout
          - flashrt-fused-quant
          - flashrt-nvfp4
          - flashrt-smallm-gemm
          - flashrt-vla-video
          - MiniMaxAI-msa-blackwell
          - vl-transformer-primitives
          - diffusion-step-ops
          - turboquant-kv
          - linear-attention-primitives
          - bf16-linear-gemv
          - transformer-fused-ops
          - grouped-moe-gemv
          - linear-attention-seq-state
          - world-model-conv
          - fp8-gemm
          - fp4-fused-ops
          - fp4-gemm
          - fa4-cute-runtime
          - fp8-kv-attention
          - causal-conv1d-state
          - gated-delta-attention
          - adaptive-layernorm-producers
          - sageattention2-blackwell
          - sageattention3-blackwell
          - speculative-draft-primitives
          - int8-transformer-primitives
          - transformer-layout-primitives
          - flashrt-siglip-fwd-fusion
          - flashrt-qkv-epilogue-train
          - flashrt-rope-train
          - flashrt-vocab-ce-train
          - flashrt-adarms-train
          - flashrt-flex-attention-train
          - int4-blackwell
          - weight-only-ffn
          - fa2-seqused-runtime
          - small-matrix-cholesky
          - fp8-prefill-attention-blackwell
          - grouped-moe-gemm
          - smallm-ffn-megakernels-blackwell
          - blockwise-fp8-producers
          - padded-fp8-producers
          - audio-codebook-primitives
          - fp8-cross-attention-blackwell
          - fused-mlp-megakernels-blackwell
          - masked-mha-runtime
      variants:
        description: "Optional comma-separated variants supported by the current builder"
        required: false
        default: ""
        type: string
      mirror_only:
        description: "Repair legacy vN/main aliases without starting an HF build job"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Keep automatic push releases serialized, but do not let independent
  # single-package repair builds cancel one another while they are pending.
  group: flashrt-hf-kernel-build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.package || 'push' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - flashrt-gemm-epilogues
          - flashrt-fp8-ffn
          - flashrt-fp8-swiglu-ffn
          - flashrt-residual-norm-quant
          - flashrt-qkv-cache-rope
          - flashrt-vla-residual-gates
          - flashrt-adaptive-norms
          - flashrt-spatiotemporal-layout
          - flashrt-fused-quant
          - flashrt-nvfp4
          - flashrt-smallm-gemm
          - flashrt-vla-video
          - MiniMaxAI-msa-blackwell
          - vl-transformer-primitives
          - diffusion-step-ops
          - turboquant-kv
          - linear-attention-primitives
          - bf16-linear-gemv
          - transformer-fused-ops
          - grouped-moe-gemv
          - linear-attention-seq-state
          - world-model-conv
          - fp8-gemm
          - fp4-fused-ops
          - fp4-gemm
          - fa4-cute-runtime
          - fp8-kv-attention
          - causal-conv1d-state
          - gated-delta-attention
          - adaptive-layernorm-producers
          - sageattention2-blackwell
          - sageattention3-blackwell
          - speculative-draft-primitives
          - int8-transformer-primitives
          - transformer-layout-primitives
          - flashrt-siglip-fwd-fusion
          - flashrt-qkv-epilogue-train
          - flashrt-rope-train
          - flashrt-vocab-ce-train
          - flashrt-adarms-train
          - flashrt-flex-attention-train
          - int4-blackwell
          - weight-only-ffn
          - small-matrix-cholesky
          - fp8-prefill-attention-blackwell
          - grouped-moe-gemm
          - smallm-ffn-megakernels-blackwell
          - blockwise-fp8-producers
          - padded-fp8-producers
          - audio-codebook-primitives
          - fp8-cross-attention-blackwell
          - fused-mlp-megakernels-blackwell
          - masked-mha-runtime

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
        if: github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == matrix.package

      - name: Detect package changes
        id: changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/changed-files.txt; then
            git diff --name-only HEAD~1 HEAD > /tmp/changed-files.txt
          fi
          if grep -qE "^${{ matrix.package }}/" /tmp/changed-files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Kernel Hub repo exists for ${{ matrix.package }}
        if: (github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == matrix.package
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade "huggingface_hub>=1.1.0"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).create_repo(
              repo_id="flashrt/${{ matrix.package }}",
              repo_type="kernel",
              exist_ok=True,
          )
          PY

      - name: Build and upload ${{ matrix.package }} via HF Jobs
        if: ((github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == matrix.package) && github.event.inputs.mirror_only != 'true'
        shell: bash
        timeout-minutes: 360
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade "huggingface_hub>=1.16.0"

          remote_script=$(base64 -w0 <<'REMOTE_SCRIPT'
          set -eux
          grep -v -E 'sandbox|filter-syscalls' /etc/nix/nix.conf > /tmp/nix.conf
          echo 'sandbox = true' >> /tmp/nix.conf
          echo 'filter-syscalls = true' >> /tmp/nix.conf
          echo 'accept-flake-config = true' >> /tmp/nix.conf
          mv /tmp/nix.conf /etc/nix/nix.conf
          git config --global user.email '${GIT_EMAIL:-ci@huggingface.co}'
          git config --global user.name '${GIT_NAME:-CI}'
          cd /tmp

          unset HF_HUB_DISABLE_IMPLICIT_TOKEN
          export GIT_LFS_SKIP_SMUDGE=1
          export DEBUG=0

          git clone "${{ github.server_url }}/${{ github.repository }}" FlashRT-HF-kernels
          cd FlashRT-HF-kernels
          git checkout "${{ github.sha }}"
          cd "${{ matrix.package }}"

          variants="${{ github.event.inputs.variants }}"
          if [[ -z "$variants" ]]; then
            # b544381 currently pins an hf-hub revision that rejects valid
            # fine-grained tokens. Keep release builds on the last validated
            # builder revision, which also provides CUTLASS 4.5.
            nix run github:huggingface/kernels/3a5c09d941a19f582fe551d038dc2b3bc6b0a03d#kernel-builder -- build-and-upload \
              --max-jobs 4 \
              --cores 8 \
              --repo-id "flashrt/${{ matrix.package }}"
          else
            IFS=',' read -ra requested_variants <<< "$variants"
            for variant in "${requested_variants[@]}"; do
              variant="${variant//[[:space:]]/}"
              [[ -n "$variant" ]] || continue
              builder_ref="github:huggingface/kernels/3a5c09d941a19f582fe551d038dc2b3bc6b0a03d#kernel-builder"
              if [[ "$variant" == torch213-* ]]; then
                builder_ref="github:huggingface/kernels/b5443818ffe69a740095bb1174ca55e7fbb34c00#kernel-builder"
                nix run "$builder_ref" -- build \
                  --variant "$variant" \
                  --max-jobs 1 \
                  --cores 8
                export FLASHRT_RELEASE_VARIANT="$variant"
                export FLASHRT_RELEASE_REPO="flashrt/${{ matrix.package }}"
                upload_python=$(nix build \
                  --no-link \
                  --print-out-paths \
                  --impure \
                  --expr 'let pkgs = import (builtins.getFlake "nixpkgs") {}; in pkgs.python313.withPackages (ps: [ ps."huggingface-hub" ])')
                "$upload_python/bin/python3.13" - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from huggingface_hub import HfApi, constants

          # Kernel repositories already have URL/type mappings in
          # huggingface_hub, but upload_folder still validates against the
          # legacy model/dataset/space-only list in current Nixpkgs releases.
          constants.REPO_TYPES[:] = constants.REPO_TYPES_WITH_KERNEL

          with open("build.toml", "rb") as handle:
              version = tomllib.load(handle)["general"]["version"]
          variant = os.environ["FLASHRT_RELEASE_VARIANT"]
          artifact = Path("result") / variant
          if not (artifact / "metadata.json").is_file():
              raise RuntimeError(f"missing built artifact: {artifact}")
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["FLASHRT_RELEASE_REPO"],
              repo_type="kernel",
              revision=f"v{version}",
              folder_path=artifact,
              path_in_repo=f"build/{variant}",
              commit_message=f"Publish {variant}",
          )
          PY
                continue
              fi
              nix run "$builder_ref" -- build-and-upload \
                --variant "$variant" \
                --max-jobs 1 \
                --cores 8 \
                --repo-id "flashrt/${{ matrix.package }}"
            done
          fi
          REMOTE_SCRIPT
          )

          hf jobs run \
            --namespace liangsu9988 \
            --flavor cpu-xl \
            --timeout 6h \
            --secrets HF_TOKEN \
            ghcr.io/huggingface/kernel-builder-job:latest \
            sh -c "printf '%s' '$remote_script' | base64 -d | bash"

      - name: Mirror ${{ matrix.package }} for legacy kernels clients
        if: (github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == matrix.package
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade "huggingface_hub>=1.1.0"
          python scripts/mirror_kernel_legacy_model.py \
            --namespace flashrt \
            --package "${{ matrix.package }}" \
            --repo-root .
          python scripts/promote_kernel_main_alias.py \
            --namespace flashrt \
            --package "${{ matrix.package }}" \
            --repo-root .
          audit_args=("${{ matrix.package }}")
          variants="${{ github.event.inputs.variants }}"
          if [[ -n "$variants" ]]; then
            IFS=',' read -ra requested_variants <<< "$variants"
            for variant in "${requested_variants[@]}"; do
              variant="${variant//[[:space:]]/}"
              [[ -n "$variant" ]] || continue
              audit_args+=(--variant "$variant")
            done
          fi
          python scripts/audit_hub_variant_matrix.py "${audit_args[@]}"

  build-fa2:
    name: Build fa2-seqused-runtime (${{ matrix.variant }})
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mirror_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each FA2 derivation instantiates the same large template set. Building
      # the complete matrix inside one HF Job previously exhausted the remote
      # job after roughly two hours. Serialize independently uploadable variants so a
      # failed toolchain target can be retried without discarding the others.
      max-parallel: 1
      matrix:
        variant:
          - torch211-cxx11-cu128-x86_64-linux
          - torch211-cxx11-cu130-x86_64-linux
          - torch212-cxx11-cu130-x86_64-linux
          - torch212-cxx11-cu132-x86_64-linux
          - torch213-cxx11-cu130-x86_64-linux
          - torch213-cxx11-cu132-x86_64-linux

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
        if: >-
          (github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == 'fa2-seqused-runtime') &&
          (github.event_name != 'workflow_dispatch' || inputs.variants == '' || contains(inputs.variants, matrix.variant))

      - name: Detect FA2 changes
        id: changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/changed-files.txt; then
            git diff --name-only HEAD~1 HEAD > /tmp/changed-files.txt
          fi
          if grep -qE "^fa2-seqused-runtime/" /tmp/changed-files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure FA2 Kernel Hub repo exists
        if: >-
          ((github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == 'fa2-seqused-runtime') &&
          (github.event_name != 'workflow_dispatch' || inputs.variants == '' || contains(inputs.variants, matrix.variant))
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade "huggingface_hub>=1.1.0"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).create_repo(
              repo_id="flashrt/fa2-seqused-runtime",
              repo_type="kernel",
              exist_ok=True,
          )
          PY

      - name: Build and upload FA2 variant via HF Jobs
        if: >-
          ((github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == 'fa2-seqused-runtime') &&
          (github.event_name != 'workflow_dispatch' || inputs.variants == '' || contains(inputs.variants, matrix.variant))
        uses: huggingface/kernel-builder-job@main
        with:
          token: ${{ secrets.HF_TOKEN }}
          namespace: liangsu9988
          flavor: cpu-performance
          timeout: "10800"
          script: |
            set +x
            export HF_TOKEN="${{ secrets.HF_TOKEN }}"
            export GIT_LFS_SKIP_SMUDGE=1
            export DEBUG=0

            git clone "${{ github.server_url }}/${{ github.repository }}" FlashRT-HF-kernels
            cd FlashRT-HF-kernels
            git checkout "${{ github.sha }}"
            cd fa2-seqused-runtime

            nix run github:huggingface/kernels#kernel-builder -- build-and-upload \
              --variant "${{ matrix.variant }}" \
              --max-jobs 1 \
              --cores 32 \
              --repo-id "flashrt/fa2-seqused-runtime"

  mirror-fa2:
    name: Mirror fa2-seqused-runtime for legacy kernels clients
    needs: build-fa2
    if: >-
      always() &&
      (needs.build-fa2.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.mirror_only == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect FA2 changes
        id: changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/changed-files.txt; then
            git diff --name-only HEAD~1 HEAD > /tmp/changed-files.txt
          fi
          if grep -qE "^fa2-seqused-runtime/" /tmp/changed-files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror and verify FA2 legacy artifacts
        if: (github.event_name == 'push' && steps.changes.outputs.changed == 'true') || github.event.inputs.package == 'all' || github.event.inputs.package == 'fa2-seqused-runtime'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade "huggingface_hub>=1.1.0"
          python scripts/mirror_kernel_legacy_model.py \
            --namespace flashrt \
            --package fa2-seqused-runtime \
            --repo-root .
          python scripts/promote_kernel_main_alias.py \
            --namespace flashrt \
            --package fa2-seqused-runtime \
            --repo-root .
          python scripts/audit_hub_variant_matrix.py fa2-seqused-runtime
