[general]
name = "adaptive-layernorm-producers"
license = "Apache-2.0"
version = 1
backends = ["cuda"]

[general.cuda]
minver = "13"
maxver = "13"

[general.hub]
repo-id = "flashrt/adaptive-layernorm-producers"

[torch]
include = ["csrc"]
src = [
  "torch-ext/torch_binding.cpp",
]

[kernel.adaptive_layernorm_producers]
backend = "cuda"
depends = ["torch"]
include = ["csrc"]
cuda-minver = "12.8"
src = [
  "csrc/ada_layer_norm_fp8.cu",
  "csrc/ada_layer_norm_fp8_ptok.cu",
  "csrc/ada_layer_norm_fp8.cuh",
  "csrc/dit_layer_norm_fp8.cu",
  "csrc/dit_layer_norm_fp8.cuh",
  "csrc/adaln_modulation6.cu",
  "csrc/adaln_modulation6.cuh",
]

[kernel.adaptive_layernorm_producers_sm110_fp4]
backend = "cuda"
depends = ["torch", "cutlass_4_4"]
include = ["csrc"]
cuda-minver = "13"
cuda-capabilities = ["11.0a"]
cuda-flags = [
  "-O3",
  "--use_fast_math",
  "-DCUTLASS_ARCH_MMA_SM100_SUPPORTED=1",
]
src = [
  "csrc/dit_norm_fp4_sfa.cu",
  "csrc/dit_norm_fp4_sfa.cuh",
  "csrc/sm110_fp4_dispatch.cu",
  "csrc/sm110_fp4_dispatch.cuh",
]
